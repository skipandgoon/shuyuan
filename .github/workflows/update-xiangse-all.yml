name: Auto-merge xiangse-all

on:
  push:
    branches: [main]
    paths:
      - 'xiangse/*.json'
      - '!xiangse/xiangse-all.json'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run merge script
        run: python scripts/merge_xiangse_all.py

      - name: Commit and push xiangse-all files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xiangse/xiangse-all.json xiangse/xiangse-all.xbs
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update xiangse-all.xbs"
            git push
          else
            echo "No change to xiangse-all"
          fi
